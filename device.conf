# The phone, for the common repository's device tooling (the same fields as hakios-sm7325's
# and hakios-mt6768's device.conf).
#
# Nothing here has been booted yet: every area is missing until a run on the phone shows it.
device x6739
	title	X6739
	vendor	Infinix
	soc	mt6893
	firmware	pull-firmware.sh
	maintainer	the HakiOS developers (README.md)
	status display works 1080x2400 on OVL0_2L (0x14001000), fb 0x76a10000 pitch 4352
	status touch missing FocalTech FT3681 on I2C0; the loader reads the chip (id 0x5662) and a real finger off the panel ('touch: finger: report over DMA ok, type=0x0 count=1 points=1', 'point id=0x0 event=0x0 x=9482 y=30656 area=16' -- 593 x 1916 on the 1080 x 2400), so the bus, the report and the decoding are proven on the hardware; the kernel's driver (kernel/bsd/dev/hakios.ft3681.c) now knows the press (event 0) as well as the contact (event 2) and posts the release, but the kernel the phone runs is the tree's prebuilt, which predates the driver: that binary has the tree's Qualcomm SPI touch driver instead
	status buttons missing
	status cpu works SMP with GICv3; Apple's launchd runs as PID 1, backboardd and SpringBoard start
	status gpu missing the window server draws with Mesa's software GLES (boot-arg gl=1: the renderer is up, 190 'hakios-gl' lines and 1000+ frames, an IOSurface at 1125x2436) and presents it ('swap 1 layer 0: surface 4 (1125x2436 BGRA)'); the picture on the panel is the Apple boot logo, which is backboardd's own boot UI overlay (BKDisplayRenderOverlayAppleLogo, drawn by BKDisplayRenderOverlayManager) and not the window server's drawing -- the loader's reading of the panel finds a shape centred on it and nothing else, and no cell of it matches the console's font; the logo is what a boot looks like on the way (the tree's QEMU shows it at about a minute and the home screen at about five), and the runs so far ended at 67 s of kernel time on one core with a software renderer, so the home screen may simply not have been reached yet (docs/ios-screen-state.md); the loader now photographs the panel twice, before XNU runs and when it comes back (mtkloader/mtkloader.c, shot_panel), which shows it as a picture
	status storage works native UFS LUN 2 controller (0x11270000), APFS root mounted
	status sensors missing
	status wifi missing conninfra, not the reference's BTIF/STP path; the tree's facts and the plan are in docs/wifi-mt6893.md
	status bluetooth missing
	status audio missing
	status battery works the loader publishes the phone's own gauge reading in the page the kernel's battery driver polls (0x80240000, battery_shared_pa=); the driver reads it and the sysctls carry it
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
	status network missing
	status usb missing the phone leaves the host's USB entirely while iOS runs, so there is no channel to it; a command goes the loader's way instead (tools/ios-cmd.sh: the host writes 'extra=cmd=...' into the pmsg request, the loader puts it on the kernel's command line, and userland/hakios-cmd.c runs it there)
